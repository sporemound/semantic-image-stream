# Audio remains local. Only a sanitized query of up to 8 story words, with
# an optional geological period hint, is sent to selected providers.
# Whisper/CLIP weights download once on first use.
# Install Ollama and manually cache qwen2.5:7b before using full-session mode.
# The app never downloads an absent narrative model; see README setup.
audio_mode = "loopback" # loopback, microphone, file
# audio_device = 25     # absent = default; enumerate with --list-devices loopback
audio_file = ""
chunk_seconds = 6.0
silence_seconds = 0.8
silence_rms = 0.008
audio_queue_size = 8
whisper_model = "base"
whisper_device = "auto" # auto, cpu, cuda; CUDA failure retries on CPU
whisper_compute_type = "auto"
language = "" # blank = automatic language detection
transcript_window_seconds = 45.0 # legacy field; full-session text is retained
semantic_interval = 4.0
search_interval = 12.0
slideshow_interval = 9.0
semantic_sensitivity = 0.45
relevance_threshold = 0.30
time_filter_enabled = false
time_filter_target = "depicted" # depicted subject/event, or created/published
time_filter_scale = "calendar" # calendar or geological; display only
# Stored as calendar years: 1 BCE = 0; geological age = 1950 - age in years.
# The UI accepts CE/BCE, BP, ka, Ma and Ga in the editable year fields.
time_filter_start = 1000.0
time_filter_end = 2026.0
time_filter_include_undated = false # when enabled, strict source date evidence by default
exclude_ai_generated = true # source labels and embedded metadata, not pixel detection
semantic_provider = "ollama" # full session; contextual/spacy are basic alternatives
context_model = "qwen2.5:7b" # complete cached local GGUF model; no cloud models
book_context = "" # visual brief: setting, concrete imagery, themes; stays local
book_guidance_strength = 0.65 # 0..1; stronger separate book contribution to image ranking
retain_context = true # automatically save and restore the last local story
session_dir = "" # blank = %LOCALAPPDATA%/SemanticImageStream/sessions on Windows
training_dir = "" # blank = local training folder, then bundled public starter pack
use_story_examples = true # local human reasoning examples; never facts about your book
context_cpu_threads = 6
context_timeout = 180.0
providers = ["wikimedia"] # priority; deviantart, duckduckgo (Bing fallback), openverse, archive available
results_per_provider = 10
prefetch_count = 6
min_width = 480
min_height = 300
min_aspect_ratio = 0.35
max_aspect_ratio = 3.0
max_download_bytes = 15000000
max_image_pixels = 40000000
download_timeout = 12.0
ranking = "context_clip" # learned_context uses bundled trained calibration; [clip] needed
clip_model = "openai/clip-vit-base-patch32"
clip_device = "cpu"
transition = "crossfade" # crossfade, dissolve, zoom, cut
transition_seconds = 0.8
attribution_visible = true
display_index = 0
# cache_dir defaults to %LOCALAPPDATA%/SemanticImageStream on Windows.
cache_ttl_hours = 24.0
cache_max_mb = 512
history_enabled = true
history_limit = 500
