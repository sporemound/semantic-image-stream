[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-image-stream"
version = "0.2.6"
description = "Local spoken context, authentic source images, a Windows desktop slideshow"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Semantic Image Stream contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "PySide6>=6.7,<7",
  "faster-whisper>=1.1,<2",
  "ctranslate2>=4.5,<5",
  "av>=12,<17",
  "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
  "sounddevice>=0.5,<0.6; sys_platform != 'win32'",
  "httpx>=0.27,<1",
  "Pillow>=10.4,<13",
  "ImageHash>=4.3,<5",
]

[project.optional-dependencies]
search = ["ddgs>=9.16,<9.17"]
semantic = ["spacy>=3.8,<4"]
clip = ["torch>=2.4,<3", "transformers>=4.46,<5"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1.2,<2"]
package = ["pyinstaller>=6.11,<7"]

[project.scripts]
semantic-image-stream = "semantic_image_stream.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_image_stream = ["data/training/*.json", "data/training/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in real network/model/audio validation"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
