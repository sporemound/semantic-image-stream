name: Diagnose AI filter tests
on:
  push:
    branches: [codex/windows-mvp]
    paths:
      - .github/workflows/diagnose-ai-filter.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libportaudio2
      - run: python -m pip install -e ".[dev,search]"
      - name: Capture test output
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: error
      - name: Preserve test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
