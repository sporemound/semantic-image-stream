name: Apply image source update
on:
  push:
    branches: [codex/windows-mvp]
    paths:
      - scripts/apply_sis_sources.py
      - .github/workflows/apply-sis-sources.yml
permissions:
  contents: write
concurrency:
  group: apply-sis-sources
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/windows-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply source changes
        run: python scripts/apply_sis_sources.py
      - name: Remove one-shot patch files
        run: rm scripts/apply_sis_sources.py .github/workflows/apply-sis-sources.yml
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libportaudio2
          python -m pip install -e ".[dev,search]"
      - name: Validate
        run: |
          python -m ruff check src tests scripts
          python -m pytest -q
      - name: Commit validated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add DeviantArt credits and resilient web image search"
          git push origin HEAD:codex/windows-mvp
