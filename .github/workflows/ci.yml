name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libportaudio2
      - run: python -m pip install -e ".[dev,search]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m build
